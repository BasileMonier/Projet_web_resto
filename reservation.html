  <main class="form-container">
    <h1 class="section-title" style="text-align:center; margin-bottom:1.5rem;">Réserver une table</h1>
    <form id="reservationForm" novalidate>
      <div class="form-group">
        <label for="nom">Nom *</label>
        <input type="text" id="nom" name="nom" required placeholder="Votre nom">
        <div class="error-message" id="error-nom"></div>
      </div>
      <div class="form-group">
        <label for="prenom">Prénom *</label>
        <input type="text" id="prenom" name="prenom" required placeholder="Votre prénom">
        <div class="error-message" id="error-prenom"></div>
      </div>
      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required placeholder="exemple@domaine.com">
        <div class="error-message" id="error-email"></div>
      </div>
      <div class="form-group">
        <label for="tel">Téléphone</label>
        <input type="tel" id="tel" name="tel" pattern="[0-9]{10}" placeholder="0612345678">
        <div class="error-message" id="error-tel"></div>
      </div>
      <div class="form-group">
        <label for="date">Date *</label>
        <input type="date" id="date" name="date" required>
        <div class="error-message" id="error-date"></div>
      </div>
      <div class="form-group">
        <label for="heure">Heure *</label>
        <select id="heure" name="heure" required>
          <option value="">Choisir un créneau</option>
          <option value="12:00">12:00</option>
          <option value="12:30">12:30</option>
          <option value="13:00">13:00</option>
          <option value="19:00">19:00</option>
          <option value="19:30">19:30</option>
          <option value="20:00">20:00</option>
          <option value="20:30">20:30</option>
        </select>
        <div class="error-message" id="error-heure"></div>
      </div>
      <div class="form-group">
        <label for="personnes">Nombre de personnes *</label>
        <input type="number" id="personnes" name="personnes" min="1" max="12" required placeholder="1 à 12">
        <div class="error-message" id="error-personnes"></div>
      </div>
      <div class="form-group">
        <label for="message">Message (optionnel)</label>
        <textarea id="message" name="message" rows="3" placeholder="Allergies, occasion spéciale..."></textarea>
      </div>
      <button type="submit" class="btn" style="width:100%;">Confirmer la réservation</button>
    </form>
    <div class="confirmation" id="confirmationMsg"></div>
  </main>

  <footer>
    <div class="footer-grid">
      <div class="footer-brand">
        <span class="logo-main serif" style="font-style:italic;color:#fff;">Perla'Bul</span>
        <span class="logo-sub">Bistrot franco-italiano</span>
        <p>28 rue du Vieux-père, 59000 Lille</p>
      </div>
    </div>
    <div class="footer-bottom"><span>© 2026 Bistrot Le Perla'Bul</span></div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/reservation.js" defer></script>
</body>
